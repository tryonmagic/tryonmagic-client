name: Package
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  package:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::551588892498:role/tryonmagic-ecr-github-action

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Deployment Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            551588892498.dkr.ecr.us-west-2.amazonaws.com/prod-tryonmagic-client:deployment-${{ inputs.tag }}
          build-args: |
            # Next.js public environment variables
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_S3_DOMAIN=${{ env.NEXT_PUBLIC_S3_DOMAIN }}
            NEXT_PUBLIC_IMAGE_PROXY_URL=${{ env.NEXT_PUBLIC_IMAGE_PROXY_URL }}
            NEXT_PUBLIC_SHOPIFY_CLIENT_ID=${{ secrets.NEXT_PUBLIC_SHOPIFY_CLIENT_ID }}
            # Server-side environment variables
            API_URL=${{ env.API_URL }}
            SHOPIFY_API_KEY=${{ secrets.SHOPIFY_API_KEY }}
            SHOPIFY_API_SECRET=${{ secrets.SHOPIFY_API_SECRET }}
            HOST=${{ env.HOST }}
            SCOPES=${{ env.SCOPES }}
            # S3 configuration
            S3_ACCESS_ID=${{ secrets.S3_ACCESS_ID }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_REGION=${{ env.S3_REGION }}
            S3_BUCKET=${{ env.S3_BUCKET }}
            S3_ENDPOINT=${{ env.S3_ENDPOINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

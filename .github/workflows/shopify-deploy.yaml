name: Shopify App Deploy
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Shopify App
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Install Dependencies
        run: pnpm install

      - name: Build Application
        run: |
          cd web
          pnpm run build
        env:
          # Build-time environment variables
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_IMAGE_PROXY_URL: ${{ vars.NEXT_PUBLIC_IMAGE_PROXY_URL }}
          NEXT_PUBLIC_S3_DOMAIN: ${{ vars.NEXT_PUBLIC_S3_DOMAIN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          HOST: ${{ vars.HOST }}
          SCOPES: ${{ vars.SCOPES }}

      - name: Configure Shopify App for Deployment
        run: |
          # Verify environment variables
          echo "Checking Shopify CLI environment..."
          echo "SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:0:8}..."
          echo "HOST: $HOST"
          echo "SCOPES: $SCOPES"
          
          # Create shopify app config if it doesn't exist
          if [ ! -f "shopify.app.toml" ]; then
            echo "Creating shopify.app.toml configuration..."
            cat > shopify.app.toml << EOF
          client_id = "${{ secrets.SHOPIFY_API_KEY }}"
          application_url = "${{ vars.HOST }}"
          embedded = true
          
          [build]
          include_config_on_deploy = true
          
          [access_scopes]
          scopes = "${{ vars.SCOPES }}"
          EOF
          fi
          
          # Display current config
          echo "Current shopify.app.toml:"
          cat shopify.app.toml
        env:
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          HOST: ${{ vars.HOST }}
          SCOPES: ${{ vars.SCOPES }}

      - name: Deploy to Shopify
        run: |
          # Set up environment for Shopify CLI
          export SHOPIFY_CLI_PARTNERS_TOKEN="${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}"
          export SHOPIFY_API_KEY="${{ secrets.SHOPIFY_API_KEY }}"
          export SHOPIFY_API_SECRET="${{ secrets.SHOPIFY_API_SECRET }}"
          export CI=true
          
          # Deploy the app
          shopify app deploy --force --no-color
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          HOST: ${{ vars.HOST }}
          SCOPES: ${{ vars.SCOPES }}
          CI: true

      - name: Deploy Success Notification
        if: success()
        run: |
          echo "✅ Shopify app successfully deployed to ${{ inputs.environment }}"
          echo "🚀 App URL: ${{ vars.HOST }}"
          echo "📦 Version: ${{ inputs.tag }}"

      - name: Deploy Failure Notification  
        if: failure()
        run: |
          echo "❌ Shopify app deployment failed for ${{ inputs.environment }}"
          echo "🔍 Check the logs above for error details" 
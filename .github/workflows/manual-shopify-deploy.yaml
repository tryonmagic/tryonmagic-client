name: Manual Shopify App Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'stg'
        type: choice
        options:
          - stg
          - prod
      force_deploy:
        description: 'Force deploy (skip confirmations)'
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    name: Deploy Shopify App
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Install Dependencies
        run: pnpm install

      - name: Build Application
        run: |
          cd web
          pnpm run build
        env:
          # Build-time environment variables
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_IMAGE_PROXY_URL: ${{ vars.NEXT_PUBLIC_IMAGE_PROXY_URL }}
          NEXT_PUBLIC_S3_DOMAIN: ${{ vars.NEXT_PUBLIC_S3_DOMAIN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          HOST: ${{ vars.HOST }}
          SCOPES: ${{ vars.SCOPES }}

      - name: Deploy to Shopify (Force)
        if: ${{ inputs.force_deploy }}
        run: shopify app deploy --force
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          HOST: ${{ vars.HOST }}
          SCOPES: ${{ vars.SCOPES }}

      - name: Deploy to Shopify (Interactive)
        if: ${{ !inputs.force_deploy }}
        run: shopify app deploy
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          HOST: ${{ vars.HOST }}
          SCOPES: ${{ vars.SCOPES }}

      - name: Deploy Success Notification
        if: success()
        run: |
          echo "✅ Shopify app successfully deployed to ${{ inputs.environment }}"
          echo "🚀 App URL: ${{ vars.HOST }}"
          echo "📦 Commit: ${{ github.sha }}"
          echo "👤 Triggered by: ${{ github.actor }}"

      - name: Deploy Failure Notification  
        if: failure()
        run: |
          echo "❌ Shopify app deployment failed for ${{ inputs.environment }}"
          echo "🔍 Check the logs above for error details"
          echo "👤 Triggered by: ${{ github.actor }}" 